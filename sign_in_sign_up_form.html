<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive sign in and sign up form." />
  <title>Account Access | Sign In & Sign Up</title>
  <style>
    :root {
      --primary: #5145cd;
      --primary-dark: #4035b4;
      --ink: #182033;
      --muted: #687187;
      --line: #e4e7ef;
      --surface: #ffffff;
      --background: #f3f5fb;
      --danger: #c03945;
      --success: #18794e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(81,69,205,.12), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(67,143,196,.12), transparent 28%),
        var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .auth-shell {
      width: min(100%, 460px);
      padding: 34px;
      border: 1px solid rgba(228,231,239,.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 22px 65px rgba(31, 41, 75, .11);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: white;
      background: var(--primary);
      font-size: 18px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      letter-spacing: -.8px;
    }
    .subtitle {
      margin: 9px 0 25px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 25px;
      border-radius: 12px;
      background: #f1f2f8;
    }
    .tab {
      min-height: 42px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: .2s ease;
    }
    .tab[aria-selected="true"] {
      color: var(--primary);
      background: white;
      box-shadow: 0 2px 8px rgba(25, 32, 56, .08);
    }
    .field { margin-bottom: 17px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
    }
    input {
      width: 100%;
      height: 47px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #a0a7b7; }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(81,69,205,.12);
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 74px; }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      padding: 5px;
      color: var(--primary);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 0 21px;
      font-size: 12px;
    }
    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
    }
    .check-label input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--primary);
    }
    a { color: var(--primary); text-decoration: none; font-weight: 650; }
    a:hover { text-decoration: underline; }
    .submit-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--primary);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .submit-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .submit-btn:focus-visible, .tab:focus-visible, .toggle-password:focus-visible {
      outline: 3px solid rgba(81,69,205,.25);
      outline-offset: 2px;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 17px;
      color: #9299a9;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .switch-copy {
      margin: 19px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .message {
      display: none;
      margin: 0 0 17px;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
    }
    .message.error { display: block; color: var(--danger); background: #fff0f1; }
    .message.success { display: block; color: var(--success); background: #eaf7f0; }
    .hidden { display: none !important; }
    .footer-note {
      margin: 24px 0 0;
      color: #9aa1af;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .auth-shell { padding: 27px 21px; border-radius: 18px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span>YOUR BRAND</span></div>

    <h1 id="formTitle">Welcome back</h1>
    <p class="subtitle" id="formSubtitle">Sign in to continue to your account.</p>

    <div class="tabs" role="tablist" aria-label="Account access">
      <button class="tab" id="signInTab" type="button" role="tab" aria-selected="true" aria-controls="signInForm">Sign In</button>
      <button class="tab" id="signUpTab" type="button" role="tab" aria-selected="false" aria-controls="signUpForm">Sign Up</button>
    </div>

    <div id="formMessage" class="message" role="status" aria-live="polite"></div>

    <form id="signInForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email address</label>
        <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button class="toggle-password" type="button" data-toggle="loginPassword">Show</button>
        </div>
      </div>
      <div class="form-options">
        <label class="check-label"><input type="checkbox" name="remember" /> Remember me</label>
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>
      <button class="submit-btn" type="submit">Sign In</button>
      <p class="switch-copy">Don't have an account? <a href="#" data-switch="signup">Create an account</a></p>
    </form>

    <form id="signUpForm" class="hidden" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required minlength="2" />
      </div>
      <div class="field">
        <label for="signupEmail">Email address</label>
        <input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="signupPassword">Create password</label>
        <div class="password-wrap">
          <input id="signupPassword" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
          <button class="toggle-password" type="button" data-toggle="signupPassword">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" required />
          <button class="toggle-password" type="button" data-toggle="confirmPassword">Show</button>
        </div>
      </div>
      <div class="form-options">
        <label class="check-label"><input id="terms" type="checkbox" required /> I agree to the <a href="#" id="termsLink">Terms</a></label>
      </div>
      <button class="submit-btn" type="submit">Create Account</button>
      <p class="switch-copy">Already have an account? <a href="#" data-switch="signin">Sign in</a></p>
    </form>

    <p class="footer-note">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
  </main>

  <script>
    const signInTab = document.getElementById('signInTab');
    const signUpTab = document.getElementById('signUpTab');
    const signInForm = document.getElementById('signInForm');
    const signUpForm = document.getElementById('signUpForm');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const message = document.getElementById('formMessage');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }
    function clearMessage() {
      message.textContent = '';
      message.className = 'message';
    }
    function switchForm(mode) {
      const isSignIn = mode === 'signin';
      signInForm.classList.toggle('hidden', !isSignIn);
      signUpForm.classList.toggle('hidden', isSignIn);
      signInTab.setAttribute('aria-selected', String(isSignIn));
      signUpTab.setAttribute('aria-selected', String(!isSignIn));
      formTitle.textContent = isSignIn ? 'Welcome back' : 'Create your account';
      formSubtitle.textContent = isSignIn
        ? 'Sign in to continue to your account.'
        : 'Enter your details to get started.';
      clearMessage();
    }

    signInTab.addEventListener('click', () => switchForm('signin'));
    signUpTab.addEventListener('click', () => switchForm('signup'));
    document.querySelectorAll('[data-switch]').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        switchForm(link.dataset.switch);
      });
    });
    document.querySelectorAll('[data-toggle]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.toggle);
        const reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        button.textContent = reveal ? 'Hide' : 'Show';
      });
    });

    signInForm.addEventListener('submit', event => {
      event.preventDefault();
      clearMessage();
      if (!signInForm.reportValidity()) return;
      showMessage('Sign-in form validated. Connect this form to your authentication backend to enable login.', 'success');
    });

    signUpForm.addEventListener('submit', event => {
      event.preventDefault();
      clearMessage();
      if (!signUpForm.reportValidity()) return;
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        showMessage('The passwords do not match. Please try again.', 'error');
        document.getElementById('confirmPassword').focus();
        return;
      }
      showMessage('Registration form validated. Connect this form to your backend to create and store accounts.', 'success');
    });

    document.getElementById('forgotPassword').addEventListener('click', event => {
      event.preventDefault();
      showMessage('Connect this link to your password-reset workflow.', 'success');
    });
    document.getElementById('termsLink').addEventListener('click', event => {
      event.preventDefault();
      showMessage('Add your Terms of Service page URL to this link.', 'success');
    });
  </script>
</body>
</html>
